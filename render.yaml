# Render Blueprint — Infrastructure as Code
# Deploy via: https://dashboard.render.com/select-repo?type=blueprint
# Docs: https://docs.render.com/blueprint-spec

services:
  - type: web
    name: studentaffairs-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./uon_clearinghouse.db
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: PAYMENTS_LIVE
        value: "false"
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GOOGLE_CLIENT_ID
        value: 572648275143-rlfpscpjipts1b52m6qab7ujjgt7a94o.apps.googleusercontent.com
      # ── Secrets (Render will prompt you to fill these during blueprint deploy) ──
      - key: JWT_SECRET_KEY
        generateValue: true  # Render auto-generates a random 64-char secret
      - key: ALLOWED_ORIGINS
        sync: false  # You'll set this after you know your Vercel domain
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_CALLBACK_SECRET
        sync: false
      - key: MPESA_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: ADVANTA_SMS_API_KEY
        sync: false
      - key: ADVANTA_SMS_PARTNER_ID
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FROM_EMAIL
        sync: false
